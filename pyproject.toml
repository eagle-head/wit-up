[project]
name = "witup-analysis"
version = "0.1.0"
description = "Analyze WIT-UP JSON exports for JUnit test feasibility."
readme = "README.md"
authors = [
    { name = "eduardokohn", email = "eduardokohn15@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "duckdb>=1.5.6",
    "ijson>=3.5.1",
]

[project.scripts]
witup-analysis = "witup_analysis:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
notebooks = [
    "jupyterlab>=4.6.4",
]
